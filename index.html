<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio Digital</title>
    <script type="module" src="./dist/main.js" defer></script>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <h1>Cardápio Digital</h1>
        <div>
          <a href="">Pratos</a>
          <a href="">Bebidas</a>
          <a href="">Sobremesas</a>
        </div>
      </nav>
    </header>

    <main class="conteiner">
      <!-- INÍCIO DO FORMULÁRIO PARA CADASTRO DE PRATOS -->
      <section class="form-section">
        <h2>Cadastrar Novo Prato</h2>

        <form id="form-produto" novalidate>
          <input type="text" id="nome" placeholder="Nome do Prato" required />
          <input
            type="number"
            id="preco"
            step="0.01"
            placeholder="Preço (R$)"
            required
          />
          <input
            type="text"
            id="descricao"
            placeholder="Descrição do Prato"
            required
          />

          <div class="campo-upload">
            <label class="btn-upload">
              <!-- <span class="icone-upload">📁</span>
              <span id="texto-arquivo">Escolher imagem do computador</span> -->
              <h3>Escolher imagem para o Cardápio</h3>
              <input type="file" id="imagemFile" accept="image/*" required />
            </label>
          </div>

          <button type="submit">Adicionar Prato</button>
        </form>
        <input
          type="text"
          id="campo-busca"
          placeholder="Buscar prato pelo nome..."
        />
      </section>
      <!-- FIM DO FORMULÁRIO PARA CADASTRO DE PRATOS -->

      <!-- Seção do cardápio (Inicia 100% Vazio)-->
      <section class="cardapio-section">
        <h2>Nossos Pratos</h2>
        <div id="cardapio-conteiner" class="cardapio-grid"></div>
      </section>
    </main>
    <footer>
      <div id="endereco">
        <p>Rua das Amoreiras, nº 1</p>
        <p>Campo Grande</p>
        <p>Rio de Janeiro, RJ</p>
      </div>

      <p id="direitos">by Grupo 4</p>
    </footer>
  </body>
</html>
