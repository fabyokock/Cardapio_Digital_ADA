<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio Digital</title>
    <script type="module" src="./dist/admin.js" defer></script> <!--ver a necessidade de ajustar essa importação-->
    <link rel="stylesheet" href="styles/style.css" /> <!--criar arquivo styleadmin.css -->
  </head>
  <body>

      <header>
          <nav>
              <h1>Cardápio Digital</h1>
                <div><a href="index.html">Ir para para página Principal</a></div>
          </nav>
      </header>
  

    <main class="conteiner">
      <!-- Seção do formulário para cadastro -->
      <section class="form-section">
        <h2>Cadastrar Novo Prato</h2>

        <form id="form-produto">
          <input type="text" id="nome" placeholder="Nome do Prato" required />
          <input
            type="number"
            id="preco"
            step="0.01"
            placeholder="Preço (R$)"
            required
          />
          <input
            type="text"
            id="descricao"
            placeholder="Descrição do Prato"
            required
          />

          <div class="campo-upload">
            <label for="imagemFile" class="btn-upload">
              <span class="icone-upload">📁</span>
              <span id="texto-arquivo">Escolher imagem do computador</span>
            </label>
            <input type="file" id="imagemFile" accept="image/*" required />
          </div>

          <button type="submit">Adicionar Prato</button>
        </form>

        <h2>Buscar Prato</h2>
        <input
          type="text"
          id="campo-busca"
          placeholder="Buscar prato pelo nome..."
        />
      </section>

      <!-- Seção do cardápio (Inicia 100% Vazio)-->
      <section class="cardapio-section">
        <h2>Nossos Pratos</h2>
        <div id="cardapio-conteiner" class="cardapio-grid"></div>
      </section>
    </main>

  </body>
</html>
